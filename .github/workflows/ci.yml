name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  test:
    name: ${{matrix.lisp}} on ${{matrix.os}}
    strategy:
      matrix:
        # NOTE: implementations are intentionally unpinned so CI tracks
        # current releases, except Allegro: bare `allegro` resolves to
        # the withdrawn 10.1express (Franz now ships 11.0), which breaks
        # the Roswell install step, so it is pinned to 11.0express.
        # NOTE: LispWorks stays supported in the source tree, but it is
        # intentionally not part of this CI test matrix.
        lisp: [abcl-bin, allegro/11.0express, ccl-bin, ecl, sbcl-bin]
        os: [ubuntu-latest]
        include:
          # CCL again with an :invert readtable, via a real env var
          # (the old "ccl-bin READTABLE_CASE_INVERT=1" entry never
          # actually exported it, so the check below never fired).
          - lisp: ccl-bin
            invert-readtable: 1
      fail-fast: false
    runs-on: ${{matrix.os}}
    env:
      READTABLE_CASE_INVERT: ${{ matrix.invert-readtable }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Roswell
        shell: bash
        env:
          LISP: ${{matrix.lisp}}
        run: curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh -x

      - name: Get Lisp info
        continue-on-error: true
        shell: bash
        run: |
          ros -e '(format t "Lisp: ~a ~a on ~a~%" (lisp-implementation-type) (lisp-implementation-version) (machine-type))'
          ros -e '(format t "Fixnum bits: ~a~%" (integer-length most-positive-fixnum))'
          ros -e '(ql:quickload "trivial-features" :silent t)' -e '(format t "Features: ~s~%" *features*)'

      - name: Raise SBCL heap
        # Roswell starts SBCL with its default 1 GB dynamic space, which is
        # not enough to compile this tree: assembling MONTGOMERY-EXPT in
        # src/math.lisp alone exhausts it ("Heap exhausted, game over").
        if: ${{ matrix.lisp == 'sbcl-bin' }}
        shell: bash
        run: ros config set dynamic-space-size 4096

      - name: Allegro workaround
        # Compiling and testing can fail on Allegro CL Express Free edition
        # because of the 50 MB heap size limitation, so let's try to split
        # the work in two as a possible workaround...
        if: ${{matrix.lisp == 'allegro/11.0express'}}
        shell: bash
        run: ros -e '(push (uiop:getcwd) asdf:*central-registry*)' -e '(setf *debugger-hook* (lambda (&rest ignorable) (declare (ignore ignorable)) (uiop:quit 0)))' -e '(ql:quickload "ironclad-unsafe/tests")'

      - name: Run tests
        shell: bash
        run: ros -e '(push (uiop:getcwd) asdf:*central-registry*)' -e '(setf *debugger-hook* (lambda (&rest ignorable) (declare (ignore ignorable)) (uiop:quit -1)))' -e '(when (plusp (length (or (uiop:getenv "READTABLE_CASE_INVERT") ""))) (format t "changing readtable-case to :invert~%") (setq *readtable* (let ((rt (copy-readtable))) (setf (readtable-case rt) :invert) rt)))' -e '(ql:quickload "ironclad-unsafe/tests")' -e '(unless (rt:do-tests) (uiop:quit -1))'
